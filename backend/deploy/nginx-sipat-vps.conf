# Modelo para VPS. Ajuste domínio, certificados, porta e caminho absoluto.
upstream sipat_api {
    keepalive 64;
    server 127.0.0.1:3001;
}

server {
    listen 443 ssl http2;
    server_name api.exemplo.com;

    client_max_body_size 500m;

    # Nginx entrega mídia diretamente e mantém suporte nativo a Range/206.
    # O diretório precisa ser persistente e não pode ser substituído no deploy.
    location ^~ /api/uploads/ {
        alias /var/www/sipat/shared/storage/uploads/;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header Access-Control-Allow-Origin "https://frontend.exemplo.com" always;
        sendfile on;
        aio threads;
    }

    location / {
        proxy_pass http://sipat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
